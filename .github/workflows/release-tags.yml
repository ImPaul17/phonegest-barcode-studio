name: Sincronizar tags públicas

on:
  workflow_call:
    inputs:
      tag:
        description: Etiqueta numérica de una versión ya publicada
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta numérica de una versión ya publicada (ej. v1.0.5)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-tag-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ImPaul17/phonegest-barcode-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Crear la tag visible sin sustituir referencias existentes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageInfo = Get-Content package.json -Raw | ConvertFrom-Json
          $internalVersion = $packageInfo.version
          $displayVersion = if ($packageInfo.displayVersion) { $packageInfo.displayVersion } else { $internalVersion }
          if ($internalVersion -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' -or $env:RELEASE_TAG -cne "v$internalVersion") {
            throw 'Indica la etiqueta numérica exacta de package.json de esa publicación.'
          }
          if ($displayVersion -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)[a-z]?$') {
            throw 'La versión pública debe ser x.y.z o x.y.z seguida de una letra minúscula.'
          }
          $releaseJson = gh release view $env:RELEASE_TAG --json tagName,isDraft,isPrerelease
          if ($LASTEXITCODE -ne 0) { throw 'La versión debe estar publicada antes de crear su tag pública.' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease -or $release.tagName -cne $env:RELEASE_TAG) {
            throw 'Solo se sincronizan publicaciones estables ya publicadas.'
          }
          $commit = git rev-parse --verify "$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo resolver el commit de la publicación.' }
          $publicTag = "v$displayVersion"
          git show-ref --verify --quiet "refs/tags/$publicTag"
          if ($LASTEXITCODE -eq 0) {
            $existingCommit = git rev-parse --verify "$publicTag^{commit}"
            if ($LASTEXITCODE -ne 0 -or $existingCommit -cne $commit) {
              throw "La tag $publicTag ya apunta a otro commit; no se modifica."
            }
            Write-Output "La tag pública $publicTag ya corresponde a $env:RELEASE_TAG."
            exit 0
          }
          $tagJson = gh api --method POST "repos/$env:GH_REPO/git/tags" -f "tag=$publicTag" -f "message=PhoneGest Barcode Studio $displayVersion (actualizador: $env:RELEASE_TAG)" -f "object=$commit" -f 'type=commit'
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear el objeto de la tag pública.' }
          $tagObject = $tagJson | ConvertFrom-Json
          gh api --method POST "repos/$env:GH_REPO/git/refs" -f "ref=refs/tags/$publicTag" -f "sha=$($tagObject.sha)"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear la referencia pública. Para recuperar una publicación, ejecuta este flujo desde su tag numérica. Las versiones anteriores a este flujo necesitan una sincronización inicial con Git.' }
          Write-Output "Creada $publicTag en el mismo commit que $env:RELEASE_TAG."
