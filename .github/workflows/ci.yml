name: Comprobar Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:ui
      - run: npm run test:updates:ui
      - name: Comprobar exportaciones reales
        run: |
          node scripts/desktop.mjs --smoke-test build/ci-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/pdf-integration.mjs build/ci-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/png-integration.mjs build/ci-smoke
      - name: Conservar capturas e informes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: comprobaciones-windows
          path: |
            artifacts/*.png
            build/ci-smoke/smoke-result.json
            build/ci-smoke/pdf-validation/report.json
            build/ci-smoke/png-validation-report.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Preparar instalador y portable sin publicar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'
        run: npx electron-builder --config electron-builder.config.cjs --win nsis portable --x64 --publish never
      - name: Verificar compilación de prueba
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node scripts/verify-package.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release-validation.mjs release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/installer-integration.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $previewSmoke = Join-Path $env:GITHUB_WORKSPACE 'build/preview-packaged-smoke'
          $previewExe = Join-Path $env:GITHUB_WORKSPACE 'release/win-unpacked/PhoneGest Barcode Studio.exe'
          $previewProcess = Start-Process -FilePath $previewExe -ArgumentList @('--smoke-test', "`"$previewSmoke`"") -WindowStyle Hidden -Wait -PassThru
          if ($previewProcess.ExitCode -ne 0) { throw "La aplicación empaquetada falló: $($previewProcess.ExitCode)" }
          node tests/pdf-integration.mjs $previewSmoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/png-integration.mjs $previewSmoke
      - name: Guardar instalador y portable de prueba
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-preview-${{ github.sha }}
          path: |
            release/*-Instalador.exe
            release/*-Instalador.exe.blockmap
            release/*-Portable.exe
            release/latest.yml
            release/release-validation.json
            build/installer-integration.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
