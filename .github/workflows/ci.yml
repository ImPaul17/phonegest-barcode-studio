name: Comprobar Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:ui
      - run: npm run test:updates:ui
      - name: Comprobar exportaciones reales
        run: |
          node scripts/desktop.mjs --smoke-test build/ci-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/pdf-integration.mjs build/ci-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/png-integration.mjs build/ci-smoke
      - name: Conservar capturas e informes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: comprobaciones-windows
          path: |
            artifacts/*.png
            build/ci-smoke/smoke-result.json
            build/ci-smoke/pdf-validation/report.json
            build/ci-smoke/png-validation-report.json
          retention-days: 7
          if-no-files-found: ignore
